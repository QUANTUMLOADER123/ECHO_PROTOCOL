name: Build APK

on:
  push:
    branches: [ "arena/0d65d7f0-echo-protocol", "main" ]
    paths:
      - "game/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Assemble ECHO PROTOCOL APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Sync game into Android assets
        run: cp game/index.html android/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename & checksum APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ECHO_PROTOCOL.apk
          sha256sum dist/ECHO_PROTOCOL.apk | tee dist/ECHO_PROTOCOL.apk.sha256
          ls -lh dist/
          echo "### 📱 ECHO PROTOCOL APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`ECHO_PROTOCOL.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256: \`$(cut -d' ' -f1 dist/ECHO_PROTOCOL.apk.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECHO_PROTOCOL-apk
          path: dist/ECHO_PROTOCOL.apk
          retention-days: 90
