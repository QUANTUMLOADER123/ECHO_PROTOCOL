name: Build APK

on:
  push:
    branches: [ "arena/0d65d7f0-echo-protocol", "main" ]
    paths:
      - "game/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Assemble ECHO PROTOCOL APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls /usr/local/lib/android/sdk || ls "$ANDROID_SDK_ROOT" || true
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls /usr/local/lib/android/sdk/platforms/ /usr/local/lib/android/sdk/build-tools/ || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Sync game into Android assets
        run: cp game/index.html android/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename & checksum APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ECHO_PROTOCOL.apk
          sha256sum dist/ECHO_PROTOCOL.apk | tee dist/ECHO_PROTOCOL.apk.sha256
          ls -lh dist/
          echo "### 📱 ECHO PROTOCOL APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`ECHO_PROTOCOL.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256: \`$(cut -d' ' -f1 dist/ECHO_PROTOCOL.apk.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECHO_PROTOCOL-apk
          path: dist/ECHO_PROTOCOL.apk
          retention-days: 90

      - name: Publish APK to repo + Release (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p releases
          cp dist/ECHO_PROTOCOL.apk releases/ECHO_PROTOCOL.apk
          cp dist/ECHO_PROTOCOL.apk.sha256 releases/ECHO_PROTOCOL.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/ECHO_PROTOCOL.apk releases/ECHO_PROTOCOL.apk.sha256
          git commit -m "Release: ECHO_PROTOCOL.apk v1.0 (built by Actions)" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
          gh release create v1.0 dist/ECHO_PROTOCOL.apk \
            --title "ECHO PROTOCOL: NEON SWARM v1.0" \
            --notes "📱 Готовый APK игры ECHO PROTOCOL: NEON SWARM. Скачай ECHO_PROTOCOL.apk, открой на телефоне (Android 7.0+), разреши установку — играй! Интернет и реклама не нужны." \
            || gh release upload v1.0 dist/ECHO_PROTOCOL.apk --clobber
